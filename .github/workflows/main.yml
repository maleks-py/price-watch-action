name: Update DA Prices (Full 139 items)

on:
  schedule:
    - cron: "0 21 * * *" # 5 AM PHT daily
  workflow_dispatch: # allow manual run

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pdfplumber requests

      - name: Fetch and parse DA PDF (full 8 pages)
        run: |
          python scripts/parse_da.py --output da-prices.json
          echo "Items: $(jq '.meta.total_items' da-prices.json)"
          cat da-prices.json | head -80

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add da-prices.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update DA $(date +%Y-%m-%d) - $(jq '.meta.total_items' da-prices.json) items"
            git push
          fi
