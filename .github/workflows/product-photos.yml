# Copy this file to .github/workflows/product-photos.yml in maleks-py/price-watch-action
#
# What it does, every time you push a photo:
#   1. normalizes photos/<productId>.jpg  -> 384x384 JPEG, ~10-20KB
#   2. uploads them to Cloudflare R2 (products/ prefix, free tier, zero egress)
#   3. rewrites products-media.json so the app picks up new photos without a rebuild
#
# Cost: $0. Public repo = free Actions minutes, R2 free tier covers 10GB storage,
# and R2 never charges for egress (downloads). No Worker involved, so the app's
# 10/hour upload rate limit is untouched.
#
# One-time setup (see ci/product-photos/README.md):
#   secrets:   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID
#   variables: R2_BUCKET, R2_PUBLIC_BASE

name: Process Product Photos

on:
  push:
    paths:
      - "photos/**"
      - "scripts/build_product_media.mjs"
      - "products.json"
      - ".github/workflows/product-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install image deps
        run: npm install --no-save --no-package-lock sharp

      - name: Normalize photos + build manifest
        env:
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: node scripts/build_product_media.mjs

      - name: Upload to R2 (S3 API - free, no egress fees)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync dist/products "s3://${{ vars.R2_BUCKET }}/products" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --delete --no-progress --content-type image/jpeg

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products-media.json
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "chore: update product photos ($(jq '.count' products-media.json) items)"
            git push
          fi
